name: Manual CI

on:
  workflow_dispatch:
    inputs:
      charts:
        description: Charts to test (comma separated)
        required: false
        default: ""

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kube: ["1.34", "1.35", "1.36", "1.37"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Determine list of charts
        id: charts
        run: |
          if [ "${{ github.event.inputs.charts }}" == "" ]; then
            echo "selector=--all" >> $GITHUB_OUTPUT
          else
            echo "selector=--charts ${{ github.event.inputs.charts }}" >> $GITHUB_OUTPUT
          fi

      # See https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0
      - name: Determine KinD node image version
        id: node_image
        run: |
          case ${{ matrix.kube }} in
            1.34)
              NODE_IMAGE=kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d ;;
            1.35)
              NODE_IMAGE=kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 ;;
            1.36)
              NODE_IMAGE=kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed ;;
            1.37)
              NODE_IMAGE=kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 ;;
            esac

            echo "image=$NODE_IMAGE" >> $GITHUB_OUTPUT

      - name: Create KinD cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          node_image: ${{ steps.node_image.outputs.image }}

      - name: Test
        run: ct lint-and-install --config ct.yaml ${{ steps.charts.outputs.selector }}
